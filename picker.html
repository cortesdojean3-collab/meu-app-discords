<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Compartilhar tela — Papo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:560px;min-height:100vh;background:#151225;color:#ece9fa;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
    header{padding:18px 22px 14px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ffffff16}h1{font-size:19px;margin:0;flex:1}#refresh{border:1px solid #ffffff22;background:#302a4d;color:#fff;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}#refresh:hover:not(:disabled){background:#403765}#refresh:disabled{opacity:.55;cursor:wait}
    #status{margin:12px 22px 0;min-height:20px;color:#c4b5fd}#status.error{color:#fecaca}#status[hidden]{display:none}#grid{flex:1;overflow:auto;padding:14px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}
    .source{min-width:0;padding:8px;text-align:left;color:inherit;background:#211d36;border:1px solid #ffffff18;border-radius:13px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}.source:hover,.source:focus-visible{outline:none;border-color:#a78bfa;background:#292344;transform:translateY(-2px)}.preview{width:100%;aspect-ratio:16/9;object-fit:contain;background:#0b0a11;border-radius:8px;display:block}.caption{display:flex;align-items:center;gap:8px;min-width:0;margin-top:9px}.app-icon{width:17px;height:17px;object-fit:contain;flex:none}.kind{font-size:10px;line-height:1;color:#d8c7ff;background:#7c3aed33;border:1px solid #a78bfa44;border-radius:999px;padding:4px 6px;flex:none}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.empty{grid-column:1/-1;padding:24px;border:1px dashed #ffffff2a;border-radius:12px;color:#b5b0c9;text-align:center}.empty strong{display:block;color:#ece9fa;margin-bottom:5px}.foot{padding:12px 22px 16px;border-top:1px solid #ffffff16;color:#aaa5bf;font-size:12px;display:flex;align-items:center;gap:12px}.foot span{flex:1}.foot button{border:1px solid #ffffff20;background:#342e52;color:#fff;border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}.foot button:hover{background:#463c6c}
    @media(max-width:700px){body{min-width:0}header,#grid,.foot{padding-left:14px;padding-right:14px}#status{margin-left:14px;margin-right:14px}#grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header><h1>O que você quer compartilhar?</h1><button id="refresh" type="button">Atualizar lista</button></header>
  <div id="status" role="status" aria-live="polite">Buscando monitores e janelas…</div>
  <div id="grid" aria-label="Monitores e janelas disponíveis"></div>
  <footer class="foot"><span id="platform-note">O Papo mostra as fontes que o sistema e o Electron disponibilizam. Algumas janelas minimizadas, protegidas ou limitadas pelo sistema podem não aparecer.</span><button id="cancel" type="button">Cancelar</button></footer>
  <script>
    const grid=document.getElementById('grid'),status=document.getElementById('status'),refreshButton=document.getElementById('refresh');
    const platformNote=document.getElementById('platform-note');let refreshing=false,lastError='';
    function setStatus(message,isError=false){status.textContent=message;status.classList.toggle('error',isError);status.hidden=!message}
    function showEmpty(){const box=document.createElement('div');box.className='empty';const strong=document.createElement('strong');strong.textContent='Nenhum monitor ou janela disponível';const detail=document.createElement('span');detail.textContent='Abra uma janela ou confira as permissões de captura e tente atualizar a lista.';box.append(strong,detail);grid.replaceChildren(box)}
    function draw(sources){grid.replaceChildren();if(!sources.length){showEmpty();return}for(const source of sources){const card=document.createElement('button');card.type='button';card.className='source';card.setAttribute('aria-label',(source.screen?'Monitor: ':'Janela: ')+source.name);const image=document.createElement('img');image.className='preview';image.alt='Prévia de '+source.name;if(source.thumb)image.src=source.thumb;else image.alt='Prévia indisponível';const caption=document.createElement('span');caption.className='caption';if(source.icon){const icon=document.createElement('img');icon.className='app-icon';icon.alt='';icon.src=source.icon;caption.append(icon)}const kind=document.createElement('span');kind.className='kind';kind.textContent=source.screen?'MONITOR':'JANELA';const name=document.createElement('span');name.className='name';name.textContent=source.name;caption.append(kind,name);card.append(image,caption);card.addEventListener('click',()=>select(source.id,card));grid.append(card)}}
    async function refresh(silent=false){if(refreshing)return;refreshing=true;refreshButton.disabled=true;if(!silent)setStatus('Buscando monitores e janelas…');try{const result=await window.picker.list();if(!result?.ok){lastError=result?.error||'Não consegui consultar as fontes.';if(!silent||!grid.childElementCount)setStatus(lastError,true);if(!grid.childElementCount)showEmpty();return}draw(result.sources||[]);if(result.platform==='darwin')platformNote.textContent='No macOS, permita Gravação de Tela para o Papo em Ajustes do Sistema > Privacidade e Segurança. Janelas minimizadas ou protegidas podem não aparecer.';else if(result.platform==='linux')platformNote.textContent='No Linux com Wayland/PipeWire, o sistema pode limitar a captura a uma fonte por vez. O Papo não pode listar janelas que o portal do sistema não disponibiliza.';else platformNote.textContent='O Papo lista as fontes entregues pelo sistema e pelo Electron. Conteúdo protegido e algumas janelas minimizadas podem ficar ocultos; atualize depois de abrir a janela.';if(!result.sources?.length)setStatus('Nenhuma fonte apareceu. Confira as permissões e tente atualizar.',true);else if(!silent||!lastError)setStatus(`${result.sources.length} fonte${result.sources.length===1?'':'s'} disponível${result.sources.length===1?'':'is'}.`);lastError=''}catch(error){lastError='O seletor não conseguiu consultar as fontes. Tente novamente.';setStatus(lastError,true);if(!grid.childElementCount)showEmpty()}finally{refreshing=false;refreshButton.disabled=false}}
    async function select(id,card){if(refreshing)return;for(const button of grid.querySelectorAll('button'))button.disabled=true;card?.setAttribute('aria-busy','true');setStatus('Confirmando que a janela ou o monitor continua disponível…');try{const result=await window.picker.choose(id);if(result?.ok)return;setStatus(result?.error||'A seleção falhou. Atualize a lista e tente novamente.',true);await refresh(true)}catch(error){console.error('[papo] Falha ao escolher a fonte de compartilhamento:',error);setStatus('Não consegui iniciar a captura. Atualize a lista e tente novamente.',true)}finally{if(grid.isConnected){for(const button of grid.querySelectorAll('button'))button.disabled=false;card?.removeAttribute('aria-busy')}}}
    refreshButton.addEventListener('click',()=>refresh());async function cancel(){try{await window.picker.choose(null)}catch(error){console.error('[papo] Falha ao cancelar o seletor:',error);setStatus('Não consegui fechar o seletor. Feche a janela e tente novamente.',true)}}document.getElementById('cancel').addEventListener('click',cancel);window.addEventListener('keydown',event=>{if(event.key==='Escape')void cancel()});refresh();const refreshTimer=setInterval(()=>{if(!document.hidden)refresh(true)},6000);window.addEventListener('pagehide',()=>clearInterval(refreshTimer),{once:true});
  </script>
</body>
</html>
