v><div class="pane" data-t="v"><label>Câmera<select id="sCam"></select></label><label>Qualidade da câmera<select id="sCq"><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option></select></label><video id="camPrev" autoplay muted playsinline></video><div class="row"><button id="sPrev">👁️ Pré-visualizar câmera</button></div><label class="cb"><input type="checkbox" id="sSaver">Economizar dados (menos qualidade e taxa de quadros)</label><p style="color:var(--mu);font-size:13px;margin:0">A qualidade da tela compartilhada é escolhida na barra da chamada. Dê duplo clique numa transmissão para destacá-la.</p></div><div class="pane" data-t="p"><label>Tema<select id="sTheme"><option value="dark">Escuro</option><option value="light">Claro</option><option value="auto">Automático</option></select></label><label>Tamanho da interface <output data-o="sScale"></output><input type="range" id="sScale" min="80" max="130"></label><label class="cb"><input type="checkbox" id="sDense">Modo compacto</label></div><div class="pane" data-t="n"><label class="cb"><input type="checkbox" id="sNotif">Notificações do navegador para novas mensagens</label><label class="cb"><input type="checkbox" id="sSnd">Sons de mensagens</label><label>Silenciar notificações e sons<select id="sMute"><option value="0">Desativado</option><option value="1">Por 1 hora</option><option value="8">Por 8 horas</option><option value="24">Por 24 horas</option></select></label></div><div class="pane" data-t="c"><button class="ac" id="sEdit">Editar nome, foto e status</button><label style="margin-top:10px">Presença<select id="sSt"><option value="online">Online</option><option value="away">Ausente</option><option value="busy">Ocupado</option></select></label><b>Sessões</b><div id="sess"></div><div class="row"><button id="sOut">Sair dos outros dispositivos</button><button id="sLogout">Sair da conta</button></div><button class="rd" id="sDel">Excluir minha conta</button></div></div></div <script>

 try{raw=await navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:Math.round(h*16/9)},height:{ideal:h},frameRate:{ideal:f}},audio:cfg.shareAud})}catch(e){ban(e.name==='NotAllowedError'?'Compartilhamento cancelado ou negado.':'Não consegui iniciar o compartilhamento: '+e.message);return}
 L.screenRaw=raw;const v=raw.getVideoTracks()[0];if(v){v.contentHint='detail';v.onended=stopShare}
 const out=new MediaStream(v?[v]:[]),at=raw.getAudioTracks()[0];
 if(at){const src=AC.createMediaStreamSource(new MediaStream([at])),g=AC.createGain(),d=AC.createMediaStreamDestination();g.gain.value=cfg.shareVol/100;src.connect(g);g.connect(d);L.shG=g;L.shSrc=src;out.addTrack(d.stream.getAudioTracks()[0])}
 else if(cfg.shareAud)ban('Seu navegador não compartilhou o áudio. No Chrome, marque "Compartilhar áudio" na janela de seleção (funciona para abas e, no Windows, para a tela inteira).');
 L.screen=out;Object.values(pcs).forEach(c=>addLocal(c,out,br));room.presence({sh:true,shid:out.id});$('#bs').textContent='⏹️ Parar tela';renderStage()}
function stopShare(){if(!L.screen)return;stopLocal(L.screen);if(L.screenRaw)L.screenRaw.getTracks().forEach(t=>t.stop());if(L.shSrc)L.shSrc.disconnect();L.screenRaw=L.shSrc=L.shG=L.screen=null;room.presence({sh:false,shid:''});$('#bs').textContent='🖥️ Compartilhar tela';renderStage()}
$('#bs').onclick=()=>{if(myVc)L.screen?stopShare():startShare()};$('#qual').onchange=async()=>{if(L.screen){stopShare();await startShare()}};
/* câmera */
const camBr=()=>cfg.saver?1:(+cfg.camq>=1080?5:2.5);
async function startCam(){const h=+cfg.camq;try{L.cam=await navigator.mediaDevices.getUserMedia({video:{deviceId:cfg.cam?{exact:cfg.cam}:undefined,width:{ideal:Math.round(h*16/9)},height:{ideal:h},frameRate:{ideal:cfg.saver?15:30}}})}catch(e){ban(e.name==='NotAllowedError'?'Permissão da câmera negada. Clique no cadeado ao lado do endereço e permita a Câmera.':'Não consegui abrir a câmera.');return}
 Object.values(pcs).forEach(c=>addLocal(c,L.cam,camBr()));room.presence({cam:true,cmid:L.cam.id});$('#bc').textContent='📷 Desligar câmera';renderStage()}
async function stopCam(){if(!L.cam)return;stopLocal(L.cam);L.cam=null;room.presence({cam:false,cmid:''});$('#bc').textContent='📷 Câmera';renderStage()}
$('#bc').onclick=()=>{if(myVc)L.cam?stopCam():startCam()};
/* ---------- voz ativa, qualidade e palco ---------- */
function watch(key,stream){if(!stream.getAudioTracks().length)return;const id=key+stream.id;if(W[id])return;const an=AC.createAnalyser();an.fftSize=512;AC.createMediaStreamSource(stream).connect(an);W[id]={an,key,stream,buf:new Uint8Array(512)}}
function setSpeaking(now,force){const sg=[...now].sort().join();if(!force&&sg===setSpeaking.l)return;setSpeaking.l=sg;curSpk=now;els.forEach((e,k)=>{if(k.startsWith('u:'))e.classList.toggle('speak',now.has(k))});document.querySelectorAll('.vm[data-p]').forEach(e=>e.classList.toggle('speak',now.has('u:'+e.dataset.p)))}
setInterval(()=>{const now=new Set();Object.entries(W).forEach(([id,w])=>{if(!w.stream.active){delete W[id];return}w.an.getByteTimeDomainData(w.buf);let sum=0;for(const v of w.buf)sum+=(v-128)*(v-128);if(Math.sqrt(sum/w.buf.length)/128>.035)now.add(w.key)});
 if(micN){micN.an.getByteTimeDomainData(micN.buf);let s=0;for(const v of micN.buf)s+=(v-128)*(v-128);const lvl=Math.sqrt(s/512)/128,loud=lvl>cfg.sens/100*.15;if(loud)micN.open=Date.now()+400;const open=Date.now()<micN.open,on=!muted&&(!cfg.ptt||pttDown);
  micN.gate.gain.setTargetAtTime(cfg.vad&&!open?0:1,AC.currentTime,.03);if(myVc&&on&&(cfg.vad?open:loud))now.add('u:'+myPeer);
  if($('#m2').style.display==='grid')$('#meter i').style.width=Math.min(100,lvl*400)+'%'}
 setSpeaking(now)},90);
setInterval(()=>Object.values(pcs).forEach(async c=>{try{const st=await c.pc.getStats();let rtt=null,lost=0,rec=0;st.forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime;if(r.type==='inbound-rtp'&&r.kind==='audio'){lost+=r.packetsLost||0;rec+=r.packetsReceived||0}});
 const d1=lost-(c.l0||0),d2=rec-(c.r0||0);c.l0=lost;c.r0=rec;const loss=d1+d2>0?d1/(d1+d2):0,qq=c.pc.connectionState==='failed'||rtt>.4||loss>.08?'bad':rtt>.2||loss>.03?'mid':'good';if(qq!==c.q){c.q=qq;renderStage()}}catch(e){}}),3000);
function tile(key,parent,make){let e=els.get(key);if(!e){e=make();els.set(key,e)}e.dataset.live='1';if(e.parentNode!==parent)parent.append(e);return e}
function ctl(l,t,fn,cls){const b=document.createElement('button');b.className='tc '+(cls||'');b.textContent=l;b.title=t;b.setAttribute('aria-label',t);b.onclick=e=>{e.stopPropagation();fn(b)};return b}
function userTile(p,mine){const d=document.createElement('div');d.className='tile';d.dataset.userTile='1';d.dataset.uid=p.presence.id;d.dataset.peer=p.peer;const l=document.createElement('span');l.className='lb';l.innerHTML='<i class="qd"></i><span class="nm"></span><span class="ic2"></span>';d.append(avEl({}),l);
 if(mine)l.querySelector('.qd').remove();else{const vp=volPanel('voice',p.presence.id);d.append(ctl('🔊','Volume desta pessoa',()=>vp.classList.toggle('open'),'vb'),vp)}return d}
function vtile(stream,loc,uid){return()=>{const d=document.createElement('div');d.className='tile vid';d.dataset.videoTile='1';d.dataset.uid=uid||'';d.tabIndex=0;const v=document.createElement('video');v.autoplay=v.muted=true;v.playsInline=true;if(loc)v.className='loc';v.srcObject=stream;const l=document.createElement('span');l.className='lb';l.innerHTML='<span class="nm"></span>';d.append(v,l);
 const key=()=>[...els].find(([,e])=>e===d)[0],bar=document.createElement('div');bar.className='tbar';
 bar.append(ctl('🔍','Destacar / voltar à grade',()=>{const k=key();focusKey=focusKey===k?null:k;renderStage()}),ctl('👥','Mostrar ou ocultar participantes',()=>{hidePeople=!hidePeople;renderStage()}),
  ctl('⛶','Tela cheia',()=>{if(document.fullscreenElement)document.exitFullscreen();else(d.requestFullscreen?d.requestFullscreen():Promise.reject()).catch(()=>ban('Seu navegador não permitiu tela cheia.'))}),ctl('✕ Sair da tela cheia','Sair da tela cheia',()=>document.exitFullscreen(),'x'));
 if(!loc&&stream.getAudioTracks().length){const vp=volPanel('share',uid);bar.append(ctl('🔊','Volume do áudio compartilhado',()=>vp.classList.toggle('open')));d.append(vp)}
 d.append(bar);d.ondblclick=()=>{const k=key();focusKey=focusKey===k?null:k;renderStage()};return d}}
function renderStage(){const g=$('#grid');els.forEach(e=>e.dataset.live='');
 if(myVc){const mem=vcMembers(myVc);
  mem.forEach(p=>{const pf=pr(p.presence.id),mine=p.isMe,pc=pcs[p.peer],t=tile('u:'+p.peer,g,()=>userTile(p,mine));
   t.querySelector('.nm').textContent=pf.name+(mine?' (você)':'');t.querySelector('.ic2').innerHTML=stIcon(p.presence);
   const qd=t.querySelector('.qd');if(qd){const qq=pc&&pc.q;qd.style.background=qq==='good'?'#22c55e':qq==='mid'?'#f59e0b':qq==='bad'?'#ef4444':'#6b7280';qd.title='Conexão: '+({good:'boa',mid:'instável',bad:'ruim'}[qq]||'conectando…')}
   const a=t.querySelector('.av');a.style.background=pf.avatar?`url(${pf.avatar}) center/cover`:(pf.color||'#7c3aed');a.textContent=pf.avatar?'':(pf.name||'?')[0].toUpperCase()});
  if(L.screen)tile('v:ls',g,vtile(L.screen,1)).querySelector('.nm').textContent='📺 Sua tela (você está compartilhando)';
  if(L.cam)tile('v:lc',g,vtile(L.cam,1)).querySelector('.nm').textContent='📷 Sua câmera';
  Object.values(pcs).forEach(c=>c.streams.forEach((s,sid)=>{const who=mem.find(p=>p.peer===c.pid),uid=who?who.presence.id:'',name=who?pr(uid).name:'Amigo';
   if(s.getVideoTracks().length){delete W['u:'+c.pid+sid];if(s.getAudioTracks().length)route(sid,s,uid,'share');const isSh=who&&who.presence.shid===sid;
    tile('v:'+sid,g,vtile(s,0,uid)).querySelector('.nm').textContent=isSh?'📺 '+name+' está compartilhando a tela':'📷 Câmera de '+name}
   else{route(sid,s,uid,'voice');watch('u:'+c.pid,s)}}))}
 els.forEach((e,k)=>{if(!e.dataset.live){e.remove();els.delete(k)}});Object.keys(R).forEach(id=>{if(!R[id].stream.active)unroute(id)});
 if(focusKey&&!els.has(focusKey))focusKey=null;g.classList.toggle('hasfocus',!!focusKey);g.classList.toggle('nopeople',!!focusKey&&hidePeople);els.forEach((e,k)=>e.classList.toggle('big',k===focusKey));setSpeaking(curSpk,1)}

function applyLook(){const dark=cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches),z=cfg.scale/100,a=$('#app');document.documentElement.dataset.theme=dark?'dark':'light';a.style.zoom=z;a.style.height=`calc(100dvh / ${z})`;document.body.classList.toggle('dense',cfg.dense)}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
const BIND={sMic:['mic'],sSpk:['spk'],sCam:['cam'],sCq:['camq'],sVol:['vol',1],sMg:['micGain',1],sSens:['sens',1],sShv:['shareVol',1],sScale:['scale',1],sTheme:['theme'],sEco:['eco',0,1],sNs:['ns',0,1],sAgc:['agc',0,1],sVad:['vad',0,1],sPtt:['ptt',0,1],sShAud:['shareAud',0,1],sSaver:['saver',0,1],sDense:['dense',0,1],sSnd:['sounds',0,1],sNotif:['notif',0,1]};
const lbl=id=>{const o=document.querySelector(`[data-o=${id}]`);if(o)o.textContent=$('#'+id).value+(id==='sScale'||id==='sVol'||id==='sMg'||id==='sShv'?'%':'')};
function fill(){Object.entries(BIND).forEach(([id,[k,,b]])=>{const e=$('#'+id);if(b)e.checked=cfg[k];else e.value=cfg[k];lbl(id)});$('#sKey').textContent=cfg.pttKey;$('#sSt').value=userSt}
async function loadDevs(){try{(await navigator.mediaDevices.getUserMedia({audio:true,video:true})).getTracks().forEach(t=>t.stop())}catch(e){try{(await navigator.mediaDevices.getUserMedia({audio:true})).getTracks().forEach(t=>t.stop())}catch(x){}}
 const d=await navigator.mediaDevices.enumerateDevices();[['sMic','audioinput','mic'],['sSpk','audiooutput','spk'],['sCam','videoinput','cam']].forEach(([id,k,key])=>{const s=$('#'+id);s.textContent='';s.append(new Option('Padrão',''));d.filter(x=>x.kind===k&&x.deviceId&&x.deviceId!=='default').forEach(x=>s.append(new Option(x.label||k,x.deviceId)));s.value=cfg[key]});if(!AC.setSinkId)$('#sSpk').disabled=true}
async function onCfg(o){setOut();applyLook();if(micN)micN.g.gain.value=cfg.micGain/100;if(L.shG)L.shG.gain.value=cfg.shareVol/100;
 if(rawMic&&(o.mic!==cfg.mic||o.eco!==cfg.eco||o.ns!==cfg.ns||o.agc!==cfg.agc))await swapMic();
 if(L.cam&&(o.cam!==cfg.cam||o.camq!==cfg.camq||o.saver!==cfg.saver)){await stopCam();await startCam()}
 if(o.ptt!==cfg.ptt){pttDown=false;applyMic()}
 if(cfg.notif&&!o.notif){if(!window.Notification){cfg.notif=false;saveCfg();fill();ban('Este navegador não suporta notificações.');return}Notification.requestPermission().then(p=>{if(p!=='granted'){cfg.notif=false;saveCfg();fill();ban('As notificações estão bloqueadas no navegador. Libere no cadeado ao lado do endereço.')}})}}
Object.entries(BIND).forEach(([id,[k,n,b]])=>{const e=$('#'+id);e.addEventListener(e.type==='range'?'input':'change',()=>{const o={...cfg};cfg[k]=b?e.checked:n?+e.value:e.value;saveCfg();lbl(id);onCfg(o)})});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.style.display=p.dataset.t===b.dataset.t?'block':'none');if(b.dataset.t==='c')loadSess();if(b.dataset.t!=='v')stopPrev()});

let testS=null,testRAF=0,prevS=null;
async function testMic(){stopTest();try{testS=await navigator.mediaDevices.getUserMedia(micC())}catch(e){ban('Sem acesso ao microfone para o teste.');return}const src=AC.createMediaStreamSource(testS),an=AC.createAnalyser();an.fftSize=512;src.connect(an);const b=new Uint8Array(512);
 (function loop(){an.getByteTimeDomainData(b);let s=0;for(const v of b)s+=(v-128)**2;$('#meter i').style.width=Math.min(100,Math.sqrt(s/512)/128*cfg.micGain/100*400)+'%';testRAF=requestAnimationFrame(loop)})()}
