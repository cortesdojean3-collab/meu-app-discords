<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">O jardim dos três anos sob a luz da lua</title>
  <desc id="desc">Um caminho de pedras lilás atravessa flores luminosas, cogumelos e ramos delicados, em direção a um portão sob uma lua cheia.</desc>
