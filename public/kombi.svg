    <path d="M154 85h9m62 0h9" stroke="#eee7f9" stroke-width="3" stroke-linecap="round"/>
    <path d="M33 91v16m4-16v16m4-16v16" stroke="#5b398d" stroke-width="1.5" stroke-linecap="round"/>

    <g fill="#f9f5ff" opacity=".9">
      <path d="M124 95a6 6 0 0 0-6 6v1a6 6 0 0 0 3 5v4l4-3h4a6 6 0 0 0 6-6v-1a6 6 0 0 0-6-6Z"/>
      <path d="M132 103a4 4 0 0 1 6 3v1a4 4 0 0 1-2 3v3l-3-2h-4a4 4 0 0 1-3-2h3a8 8 0 0 0 3-6Z" opacity=".65"/>
    </g>

    <path d="M251 64h11v13" fill="none" stroke="#332442" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="259" y="66" width="10" height="15" rx="4" fill="url(#chrome)" stroke="#493650" stroke-width="2"/>
    <path d="m259 61 8 8" stroke="#594d68" stroke-width="2" stroke-linecap="round"/>
    <path d="M280 80h11" stroke="#a497b7" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="300" cy="91" rx="18" ry="19" fill="url(#headlight)"/>
    <rect x="287" y="84" width="10" height="14" rx="5" fill="#fff0bb" stroke="#81758c" stroke-width="2"/>
    <path d="M290 87v7" stroke="#fffbe9" stroke-width="2" stroke-linecap="round"/>
    <rect x="26" y="86" width="5" height="13" rx="2" fill="#e57689" stroke="#634451" stroke-width="1.5"/>
    <path d="M27 114h18m226 0h29" stroke="#332442" stroke-width="7" stroke-linecap="round"/>
    <path d="M27 113h18m226 0h29" stroke="url(#chrome)" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 117h93" stroke="#3f275e" stroke-opacity=".44" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
