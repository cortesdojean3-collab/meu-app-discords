<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 320 150" role="img" aria-labelledby="title desc">
  <title id="title">Kombi branca e roxa do Papo</title>
  <desc id="desc">Uma Kombi clássica com janelas azuladas, carroceria branca, faixa roxa e rodas em movimento.</desc>
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".66" stop-color="#f4f0fa"/>
      <stop offset="1" stop-color="#d9d3e5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ae87f8"/>
      <stop offset=".46" stop-color="#8b5ddb"/>
      <stop offset="1" stop-color="#633caf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a4c3e0"/>
      <stop offset=".48" stop-color="#67839d"/>
      <stop offset="1" stop-color="#3c435f"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#cec9df"/>
      <stop offset="1" stop-color="#9185a9"/>
    </linearGradient>
    <radialGradient id="headlight">
      <stop stop-color="#fffadf" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .suspension { animation: suspension 1.05s ease-in-out infinite; }
      .wheel-hub { transform-box: fill-box; transform-origin: center; animation: wheel-spin .68s linear infinite; }
      .road-shadow { transform-box: fill-box; transform-origin: center; animation: shadow-breathe 1.05s ease-in-out infinite; }
      @keyframes suspension { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.3px); } }
      @keyframes wheel-spin { to { transform: rotate(360deg); } }
      @keyframes shadow-breathe { 50% { opacity: .72; transform: scaleX(.98); } }
      svg:target * { animation: none !important; }
      @media (prefers-reduced-motion: reduce) { .suspension, .wheel-hub, .road-shadow { animation: none; } }
    </style>
  </defs>

  <ellipse class="road-shadow" cx="161" cy="142" rx="135" ry="5.5" fill="#080511" opacity=".86"/>

  <g class="suspension">
    <path d="M27 107V46c0-17 10-27 28-27h150c18 0 30 6 41 20l26 31 16 6c8 3 12 10 12 19v14c0 8-5 12-13 12h-27c-1-16-11-27-26-27s-25 11-27 27H107c-1-16-12-27-27-27s-26 11-28 27H42c-10 0-15-5-15-14Z" fill="url(#paint)" stroke="#332442" stroke-width="3" stroke-linejoin="round"/>
    <path d="M29 83h269v26c0 7-4 10-11 10h-27c-2-15-12-26-26-26s-25 11-28 26h-99c-2-15-12-26-27-26s-26 11-29 26h-9c-9 0-13-4-13-12Z" fill="url(#purple)"/>
    <path d="M46 25h155c17 0 29 6 38 17" fill="none" stroke="#fff" stroke-opacity=".84" stroke-width="3" stroke-linecap="round"/>

    <g fill="url(#glass)" stroke="#594d68" stroke-width="2.5" stroke-linejoin="round">
      <path d="M44 40c0-6 3-9 9-9h33v37H42Z"/>
      <path d="M96 31h46v37H96Z"/>
      <path d="M152 31h48c5 0 8 2 11 5v32h-59Z"/>
      <path d="M222 35c6 3 11 7 15 13l17 20h-32Z"/>
