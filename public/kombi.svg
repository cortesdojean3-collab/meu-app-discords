    <circle cx="80" cy="121" r="17.5" fill="none" stroke="#32293d" stroke-width="1.5"/>
    <circle cx="80" cy="121" r="12" fill="url(#chrome)" stroke="#191624" stroke-width="1.5"/>
    <g class="wheel-hub">
