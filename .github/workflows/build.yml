name: Gerar executaveis
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: papo-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: |
          cd out
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build.{1}', needs.build.outputs.version, github.run_number) }}
          name: Papo ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build.{1}', needs.build.outputs.version, github.run_number) }}
          generate_release_notes: true
          files: out/*
